*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#f4f6f9;min-height:100vh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
.container{width:100%;max-width:460px;padding:28px 18px 48px}
.header{background:#fff;border-radius:18px;padding:24px 20px 18px;text-align:center;margin-bottom:26px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(20,50,90,.05)}
.header img{height:42px;width:auto;display:block;margin:0 auto}
.header-sub{font-size:12px;color:#7a8494;margin-top:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:500}
.prompt{text-align:center;font-size:15px;color:#5a6675;margin-bottom:18px}
.list{display:flex;flex-direction:column;gap:12px}
.city-btn{display:flex;align-items:center;justify-content:space-between;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px 20px;cursor:pointer;text-align:left;box-shadow:0 1px 3px rgba(20,50,90,.05);font-family:inherit;transition:transform .12s,border-color .15s}
.city-btn:hover{border-color:#0055A4}
.city-btn:active{transform:scale(.985)}
.city-left{display:flex;align-items:center;gap:12px}
.city-name{font-size:17px;font-weight:600;color:#1e2530}
.city-count{font-size:13px;color:#94a0b0;font-weight:500}
.back-btn{display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;color:#0055A4;font-size:14px;font-weight:600;margin-bottom:18px;padding:4px 0;font-family:inherit}
.city-title{font-size:22px;font-weight:800;color:#1e2530;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.city-title::before{content:'';width:4px;height:22px;background:#E30613;border-radius:2px;flex-shrink:0}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(20,50,90,.05)}
.card-name{font-size:16px;font-weight:700;color:#1e2530;margin-bottom:9px;line-height:1.3}
.row{display:flex;align-items:flex-start;gap:8px;color:#5a6675;font-size:13.5px;margin-top:4px;line-height:1.45}
.row svg{flex-shrink:0;margin-top:1px;color:#a0abbb}
.btns{display:flex;gap:10px;margin-top:15px}
.map-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;border-radius:12px;font-size:14px;font-weight:600;text-decoration:none;border:1.5px solid #0055A4;color:#0055A4;background:#fff;transition:opacity .15s}
.map-btn.filled{background:#0055A4;color:#fff;border-color:#0055A4}
.map-btn:active{opacity:.75}
.footer{text-align:center;margin-top:34px;font-size:12px;color:#a0abbb}
.hidden{display:none}
</style>

function plural(n){const a=Math.abs(n)%100,b=n%10;
 if(a>10&&a<20)return"салонов";if(b>1&&b<5)return"салона";if(b===1)return"салон";return"салонов";}

function renderCities(){
  document.getElementById('citiesList').innerHTML = CITIES.map(c=>
    '<button class="city-btn" onclick="showCity(\''+c.id+'\')">'+
      '<span class="city-left">'+ICON_PIN+'<span class="city-name">'+c.name+'</span></span>'+
      '<span class="city-count">'+c.stores.length+' '+plural(c.stores.length)+'</span>'+
    '</button>').join('');
}

function showCity(id){
  const c = CITIES.find(x=>x.id===id);
  document.getElementById('cityTitle').textContent = c.name;
  document.getElementById('storesList').innerHTML = c.stores.map(s=>{
    return '<div class="card"><div class="card-name">'+s.name+'</div>'+
      '<div class="btns">'+
        '<a class="map-btn filled" href="'+s.gis2+'" target="_blank" rel="noopener">'+ICON_NAV+'2ГИС</a>'+
        '<a class="map-btn" href="'+s.yandex+'" target="_blank" rel="noopener">'+ICON_NAV+'Яндекс</a>'+
      '</div></div>';
  }).join('');
  document.getElementById('screenCities').classList.add('hidden');
  document.getElementById('screenStores').classList.remove('hidden');
  window.scrollTo(0,0);
}

function showCities(){
  document.getElementById('screenCities').classList.remove('hidden');
  document.getElementById('screenStores').classList.add('hidden');
  window.scrollTo(0,0);
}

renderCities();
