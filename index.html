<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EuroMebel — Магазины</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f4f6f9; min-height: 100vh; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 460px; padding: 28px 18px 48px; }
    .header { background: #fff; border-radius: 18px; padding: 22px 20px 18px; text-align: center; margin-bottom: 26px; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px rgba(20,50,90,0.05); }
    .header img { height: 44px; width: auto; display: inline-block; }
    .header-subtitle { font-size: 12.5px; color: #7a8494; margin-top: 10px; text-transform: uppercase; letter-spacing: 0.14em; }
    .cities-list { display: flex; flex-direction: column; gap: 12px; }
    .city-btn { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px 20px; cursor: pointer; text-align: left; box-shadow: 0 1px 3px rgba(20,50,90,0.05); transition: transform 0.1s; font-family: inherit; }
    .city-btn:active { transform: scale(0.985); }
    .city-btn-content { display: flex; align-items: center; gap: 12px; flex: 1; }
    .city-btn-icon { color: #0055A4; }
    .city-btn-name { font-size: 17px; font-weight: 600; color: #1e2530; }
    .city-btn-count { font-size: 13px; color: #94a0b0; font-weight: 500; }
    
    .back-btn { display: flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; color: #0055A4; font-size: 14px; font-weight: 600; margin-bottom: 18px; padding: 4px 0; font-family: inherit; }
    .city-title { font-size: 22px; font-weight: 800; color: #1e2530; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .city-title::before { content: ''; display: inline-block; width: 4px; height: 22px; background: #E30613; border-radius: 2px; }
    
    .stores-list { display: flex; flex-direction: column; gap: 14px; }
    .store-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px; box-shadow: 0 1px 3px rgba(20,50,90,0.05); }
    .store-name { font-size: 16px; font-weight: 700; color: #1e2530; margin-bottom: 8px; }
    .store-row { display: flex; align-items: center; gap: 8px; color: #5a6675; font-size: 13.5px; margin-top: 3px; }
    .store-row-icon { color: #a0abbb; display: flex; }
    .store-buttons { display: flex; gap: 10px; margin-top: 14px; }
    .map-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 8px; border-radius: 12px; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; border: 1.5px solid #0055A4; color: #0055A4; background: #fff; transition: all 0.2s; }
    .map-btn.filled { background: #0055A4; color: #fff; border: none; }
    .map-btn:hover { transform: translateY(-1px); }
    
    .footer { text-align: center; margin-top: 36px; font-size: 12px; color: #a0abbb; }
    .hidden { display: none !important; }
    
    svg { display: inline; }
  </style>
</head>

    function plural(n) {
      const a = Math.abs(n) % 100, b = n % 10;
      if (a > 10 && a < 20) return "салонов";
      if (b > 1 && b < 5) return "салона";
      if (b === 1) return "салон";
      return "салонов";
    }

    function renderCities() {
      const list = document.getElementById('citiesList');
      list.innerHTML = CITIES.map(city => `
        <button class="city-btn" onclick="showCity('${city.id}')">
          <span class="city-btn-content">
            <span class="city-btn-icon">📍</span>
            <span class="city-btn-name">${city.name}</span>
          </span>
          <span class="city-btn-count">${city.stores.length} ${plural(city.stores.length)}</span>
        </button>
      `).join('');
    }

    function showCity(cityId) {
      const city = CITIES.find(c => c.id === cityId);
      document.getElementById('cityTitle').textContent = city.name;
      
      const list = document.getElementById('storesList');
      list.innerHTML = city.stores.map(store => `
        <div class="store-card">
          <div class="store-name">${store.name}</div>
          <div class="store-row">
            <span class="store-row-icon">📍</span>
            <span>${store.address}</span>
          </div>
          <div class="store-row">
            <span class="store-row-icon">🕐</span>
            <span>${store.hours}</span>
          </div>
          <div class="store-row">
            <span class="store-row-icon">📞</span>
            <span>${store.phone}</span>
          </div>
          <div class="store-buttons">
            <a href="${store.gis2}" target="_blank" class="map-btn filled">🧭 2ГИС</a>
            <a href="${store.yandex}" target="_blank" class="map-btn">🧭 Яндекс.Карты</a>
          </div>
        </div>
      `).join('');
      
      document.getElementById('citiesScreen').classList.add('hidden');
      document.getElementById('storesScreen').classList.remove('hidden');
    }

    function showCities() {
      document.getElementById('citiesScreen').classList.remove('hidden');
      document.getElementById('storesScreen').classList.add('hidden');
    }

    renderCities();
  </script>

</html>
